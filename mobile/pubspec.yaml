name: zarf
description: "Zarf — dijital davetiye uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  url_launcher: ^6.3.3
  add_2_calendar: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fontlar uygulamaya gömülü; çalışırken üçüncü tarafa istek gitmez (lisans: assets/fonts/OFL-*.txt).
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    # Değişken font; ağırlık `wght` ekseniyle verilir (bkz. lib/core/theme/app_theme.dart).
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
